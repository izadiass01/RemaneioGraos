<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Editar Pesagem - Remaneio de Grãos</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>

    <header>

        <div class="logo">
            🌾 Remaneio de Grãos
        </div>

        <nav>

            <a href="/">
                Início
            </a>

            <a href="/cadastro-pesagem">
                Registrar Pesagem
            </a>

        </nav>

    </header>


    <main class="container">

        <div class="formulario-card">

            <h1>
                ✏️ Editar Pesagem
            </h1>

            <p class="subtitulo">
                Altere os dados da pesagem e salve as modificações.
            </p>


            {% if mensagem %}

                <div class="mensagem">
                    {{ mensagem }}
                </div>

            {% endif %}


            <form method="POST">

                <div class="campo">

                    <label for="placa">
                        Placa do Caminhão
                    </label>

                    <input
                        type="text"
                        id="placa"
                        name="placa"
                        value="{{ pesagem.placa }}"
                        maxlength="7"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="peso_bruto">
                        Peso Bruto (kg)
                    </label>

                    <input
                        type="number"
                        id="peso_bruto"
                        name="peso_bruto"
                        value="{{ pesagem.peso_bruto }}"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="tara">
                        Tara do Caminhão (kg)
                    </label>

                    <input
                        type="number"
                        id="tara"
                        name="tara"
                        value="{{ pesagem.tara }}"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>


                <button type="submit">
                    💾 Salvar Alterações
                </button>

            </form>


            <a
                href="/cadastro-pesagem"
                class="botao-voltar"
            >
                ← Voltar para Pesagens
            </a>

        </div>

    </main>


    <footer>

        <p>
            Projeto Remaneio de Grãos • Controle de Pesagem
        </p>

    </footer>

</body>

</html>
